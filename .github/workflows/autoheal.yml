# AutoHeal AI: `npx xsignon-autoheal init` writes this file to
# .github/workflows/autoheal.yml, fills in your test workflow and install
# steps, and checks your settings. Or copy it by hand.
#
# It runs after your Playwright workflow fails, on your own GitHub runner,
# with your own AI key. No XSignOn server is involved and nothing leaves the
# runner except calls to the AI provider you choose.
#
# Three jobs:
#   heal     runs your tests and the AI's proposed fixes with a READ-ONLY token
#            and uploads a patch.
#   publish  never runs your project's code: it checks the patch in a fresh
#            checkout (paths, file types, no hooks), opens the fix PR and
#            starts your test workflow on it, so the PR gets its CI checks.
#   learn    once a day: records what each locator points at, so the next
#            broken locator is fixed without AI tokens.
#
# Before you start:
#   1. Set the name under `workflows:` below to the `name:` of your test workflow.
#   2. In that test workflow, keep the report and traces as artifacts, e.g.
#        reporter: [['list'], ['json', { outputFile: 'playwright-report/results.json' }]]
#        use: { trace: 'retain-on-failure', screenshot: 'only-on-failure' }
#      and after the tests:
#        - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
#          if: failure()
#          with: { name: playwright-results, path: "playwright-report/\ntest-results/" }
#      Optional, heal during the run (Playwright Test): import `test` from
#      'xsignon-autoheal/playwright' and also upload what it healed, even on a
#      green run, so AutoHeal turns each heal into a code fix:
#        - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
#          if: always()
#          with: { name: autoheal-healed, path: autoheal-healed/, if-no-files-found: ignore }
#   3. Add your AI key as a repository secret named ANTHROPIC_API_KEY
#      (or OPENAI_API_KEY; see the README for local models).
#   4. Settings > Actions > General > Workflow permissions: tick
#      "Allow GitHub Actions to create and approve pull requests",
#      or opening the PR fails with "not permitted to create pull requests".
#   5. Optional: add a .autoheal.yml at the repo root with your team's rules
#      (protected folders, tests to skip, allowed fix kinds, tighter limits).
#      See templates/autoheal-policy.yml.
#   6. Make the heal job match your test job: the same Node or Python version,
#      browsers, environment variables, secrets and services (database, app
#      server). If AutoHeal cannot reproduce the failure it says so and changes
#      nothing.
#
#   7. Add `workflow_dispatch:` to the `on:` list of your test workflow. The
#      publish job uses it to run your CI on the fix PR (a PR opened with the
#      default GITHUB_TOKEN starts no workflows on its own).
#
# Notes:
#   - workflow_run only fires from the copy of this file on your default branch.
#   - Your AI key is in the heal job, where your tests and proposed fixes run.
#     Use a key with a spend limit.

name: AutoHeal AI

on:
  workflow_run:
    workflows: ["Playwright Tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of the failed workflow run to heal
        required: true
      mode:
        description: What AutoHeal should do with its fixes
        type: choice
        options: [draft-pr, pr, comment]
        default: draft-pr
  # Learn element fingerprints once a day from a green run of your tests.
  schedule:
    - cron: "17 3 * * *"

permissions: {}

concurrency:
  # At most one heal attempt per failed run; a second trigger waits.
  group: autoheal-${{ github.event.workflow_run.id || github.event.inputs.run_id }}
  cancel-in-progress: false

jobs:
  heal:
    # Only failed runs (or green runs that healed during the run), never
    # AutoHeal's own branches (no loops), and never runs from forks (their
    # code would run with your AI key).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success') &&
       !startsWith(github.event.workflow_run.head_branch, 'autoheal/') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      # Read earlier AutoHeal PRs, to learn what reviewers kept, edited or closed.
      pull-requests: read
    outputs:
      run-id: ${{ steps.run.outputs.id }}
      sha: ${{ steps.run.outputs.sha }}
      branch: ${{ steps.run.outputs.branch }}
      pr-number: ${{ steps.run.outputs.pr }}
      workflow: ${{ steps.run.outputs.workflow }}
      blocked: ${{ steps.autoheal.outputs.blocked }}
      has-result: ${{ steps.autoheal.outputs.has-result }}
    steps:
      # Looks up the failed run, for manual runs too, so the right commit and
      # branch are healed. Runs before any project code.
      - name: Find the failed run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id must be a number"; exit 1; }
          info="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}")"
          head_repo="$(jq -r '.head_repository.full_name' <<< "$info")"
          branch="$(jq -r '.head_branch' <<< "$info")"
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then echo "::error::Run ${RUN_ID} is from a fork (${head_repo}); AutoHeal only heals runs from this repo."; exit 1; fi
          if [[ "$branch" == autoheal/* ]]; then echo "::error::Run ${RUN_ID} is on an AutoHeal branch."; exit 1; fi
          # A green run is only worth healing when it healed locators during the run.
          skip=false
          # A run of AutoHeal's own fix commit (fix-target: pr-branch) is never healed again: no loops.
          if jq -r '.head_commit.message // ""' <<< "$info" | head -1 | grep -q '^test: AutoHeal fixes for failed run'; then
            skip=true; echo "Run ${RUN_ID} tests AutoHeal's own fix commit; not healing it again."
          fi
          if [ "$skip" = false ] && [ "$(jq -r '.conclusion' <<< "$info")" = "success" ]; then
            healed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "autoheal-healed" and .expired == false)] | length')"
            if [ "$healed" = "0" ]; then skip=true; echo "Green run with nothing healed: nothing to do."; fi
          fi
          {
            echo "skip=${skip}"
            echo "id=${RUN_ID}"
            echo "sha=$(jq -r '.head_sha' <<< "$info")"
            echo "branch=${branch}"
            echo "pr=$(jq -r '.pull_requests[0].number // ""' <<< "$info")"
            echo "workflow=$(jq -r '.path // ""' <<< "$info" | sed 's|.*/||; s|@.*||')"
          } >> "$GITHUB_OUTPUT"

      - if: steps.run.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.run.outputs.sha }}
          # History, so AutoHeal can name the app commit that broke a test.
          fetch-depth: 200
          # No token on disk while tests and proposed fixes run.
          persist-credentials: false

      - if: steps.run.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No dependency cache here: this job runs proposed fixes, and a cache it
          # saved would be restored by your other workflows.
          cache: ''

      - name: Install dependencies and browsers
        if: steps.run.outputs.skip != 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Cypress projects: install with `npm ci` (it also downloads the Cypress
      # binary) instead of the Playwright browsers. In your test workflow, use
      # the built-in junit reporter and upload the reports, screenshots and
      # AutoHeal's page snapshots (from the xsignon-autoheal/cypress plugin):
      #   npx cypress run --reporter junit --reporter-options "mochaFile=cypress/results/results-[hash].xml"
      #   path: "cypress/results/\ncypress/screenshots/\ncypress/autoheal/"
      # AutoHeal finds the Cypress config and reruns specs through Cypress itself.

      # WebdriverIO projects: add @wdio/junit-reporter to your reporters
      # (outputDir: 'reports') and upload reports/ from your test workflow.
      # AutoHeal finds wdio.conf and reruns single tests through WebdriverIO.

      # pytest-playwright projects: uncomment instead of the Node install above.
      # - uses: actions/setup-python@v5
      #   with: { python-version: '3.12' }
      # - run: |
      #     pip install -r requirements.txt
      #     python -m playwright install --with-deps chromium

      - name: Download the failed run's report and traces
        if: steps.run.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: autoheal-artifacts

      - name: AutoHeal
        id: autoheal
        if: steps.run.outputs.skip != 'true'
        # Pin this (and publish below) to a commit SHA if your policy requires it.
        uses: xsignon-secure/AutoHeal-AI@v0.12.1
        with:
          report: autoheal-artifacts
          mode: ${{ github.event.inputs.mode || 'draft-pr' }}
          run-id: ${{ steps.run.outputs.id }}
          commit: ${{ steps.run.outputs.sha }}
          branch: ${{ steps.run.outputs.branch }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          # model: <your OpenAI model>
          # price-in: '0'   # required for models AutoHeal has no price for
          # price-out: '0'
          max-usd: '1.00'
          # Start your app so the AI can check locators on the real page (runs in the sandbox, no secrets):
          # start-command: npm run start
          # start-url: http://localhost:3000

  publish:
    needs: heal
    if: always() && needs.heal.outputs.has-result == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # Starts your test workflow on the fix PR (workflow_dispatch).
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.heal.outputs.sha }}
          persist-credentials: false

      - name: Download the heal result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: autoheal-result
          path: autoheal-result

      - name: Publish
        uses: xsignon-secure/AutoHeal-AI/publish@v0.12.1
        with:
          # Folders a fix may change. Add yours if page objects live outside tests/ or e2e/.
          # allowed-paths: 'tests/**, e2e/**, pages/**'
          result-dir: autoheal-result
          mode: ${{ github.event.inputs.mode || 'draft-pr' }}
          base-branch: ${{ needs.heal.outputs.branch }}
          run-id: ${{ needs.heal.outputs.run-id }}
          commit: ${{ needs.heal.outputs.sha }}
          pr-number: ${{ needs.heal.outputs.pr-number }}
          blocked: ${{ needs.heal.outputs.blocked }}
          # Your test workflow, started on the fix PR so it gets its checks.
          rerun-workflow: ${{ needs.heal.outputs.workflow }}
          # Push the fix onto the failing PR's own branch instead of opening a separate PR:
          # fix-target: pr-branch
          # dashboard-url: https://autoheal.example.com
          # dashboard-secret: ${{ secrets.AUTOHEAL_DASHBOARD_SECRET }}

  learn:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: ''

      - name: Install dependencies and browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Runs your tests once with traces on and keeps only short element
      # labels (role, name, test id). No AI, no secrets.
      - name: Learn element fingerprints
        run: npx -y xsignon-autoheal@0.12.1 learn --out .autoheal-learned

      # The heal job downloads the newest copy of this artifact by itself.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autoheal-fingerprints
          path: .autoheal-learned
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: ignore
